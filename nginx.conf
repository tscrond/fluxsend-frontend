server {
    listen 8000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all backend routes at their actual paths
    location /auth/ {
        proxy_pass http://$NGINX_BACKEND_HOST:$NGINX_BACKEND_PORT/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy backend API routes under /files/ (explicit endpoints only)
    location ~ ^/files/(upload|share|received/unseen_count|received/mark_seen|received|shared_by_user|delete/batch|delete|tree|move|quick_share|[a-f0-9]+/note)$ {
        proxy_pass http://$NGINX_BACKEND_HOST:$NGINX_BACKEND_PORT$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    # Proxy folder API routes
    location /folders {
        proxy_pass http://$NGINX_BACKEND_HOST:$NGINX_BACKEND_PORT$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /user/ {
        proxy_pass http://$NGINX_BACKEND_HOST:$NGINX_BACKEND_PORT/user/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /d/ {
        proxy_pass http://$NGINX_BACKEND_HOST:$NGINX_BACKEND_PORT/d/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /share/info/ {
        proxy_pass http://$NGINX_BACKEND_HOST:$NGINX_BACKEND_PORT/share/info/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /share/resolve/ {
        proxy_pass http://$NGINX_BACKEND_HOST:$NGINX_BACKEND_PORT/share/resolve/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /share/revoke/ {
        proxy_pass http://$NGINX_BACKEND_HOST:$NGINX_BACKEND_PORT/share/revoke/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy workspace API routes (explicit endpoints only — /workspaces and /workspaces/:id are SPA routes)
    location ~ ^/workspaces/(list|create|members/remove|members/role|members|invites/mine|invites/create|invites/accept|invites/reject|invites/delete|invites|delete|rename)$ {
        proxy_pass http://$NGINX_BACKEND_HOST:$NGINX_BACKEND_PORT$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy workspace file endpoints (contains UUID path segment)
    location ~ ^/workspaces/[0-9a-f-]+/files/ {
        proxy_pass http://$NGINX_BACKEND_HOST:$NGINX_BACKEND_PORT$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
    }

    # Proxy workspace quota endpoint
    location ~ ^/workspaces/[0-9a-f-]+/quota$ {
        proxy_pass http://$NGINX_BACKEND_HOST:$NGINX_BACKEND_PORT$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Workspace API key endpoints live on the main API server; keep them away from the CLI /api prefix.
    location ^~ /api_keys/ {
        proxy_pass http://$NGINX_BACKEND_HOST:$NGINX_BACKEND_PORT$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # # CLI server lives behind /api on its dedicated port.
    location = /api {
        proxy_pass http://$NGINX_BACKEND_HOST:$NGINX_BACKEND_API_PORT/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://$NGINX_BACKEND_HOST:$NGINX_BACKEND_API_PORT$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # /share/:token → SPA (must come after the backend proxy rules above)
    location /share/ {
        try_files $uri /index.html;
    }

    # SPA fallback — must be last
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
