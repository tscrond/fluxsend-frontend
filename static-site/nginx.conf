server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index landing.html;

    # Security headers live here (server level). The locations below only use
    # `expires`, never `add_header`, so these stay inherited everywhere.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json application/xml text/plain image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The page shell must be revalidated, otherwise a deploy looks like it did
    # nothing because the browser keeps serving a stale copy.
    location = / {
        expires -1;
        try_files /landing.html =404;
    }

    location = /landing.html {
        expires -1;
    }

    # Legal documents. The landing page footer links to
    # /legal/privacy-policy.html and /legal/terms-of-service.html, which are
    # published into /usr/share/nginx/html/legal/. Serve them no-cache like the
    # shell so an updated policy goes live without a hard refresh. The
    # extensionless spellings and a bare /legal/ resolve to the same files, and
    # `try_files` is used instead of a redirect so the port is never rewritten
    # (the exact /legal match also suppresses nginx's add-trailing-slash 301).
    location = /legal {
        expires -1;
        try_files /legal/privacy-policy.html =404;
    }

    location = /legal/ {
        expires -1;
        try_files /legal/privacy-policy.html =404;
    }

    location ^~ /legal/ {
        expires -1;
        try_files $uri $uri.html =404;
    }

    # Assets: cached for a week rather than a year so a changed logo replaces
    # the old one without a hard refresh.
    location ~* \.(png|svg|ico|jpg|jpeg|webp|gif|woff|woff2)$ {
        expires 7d;
    }

    # Only the landing shell and the legal pages are published: anything else
    # is genuinely not found.
    location / {
        try_files $uri $uri/ =404;
    }
}
